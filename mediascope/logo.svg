<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" stroke="#ffffff" stroke-width="10"/>
  
  <!-- Camera/Media Icon -->
  <g transform="translate(100, 100)">
    <!-- Camera Body -->
    <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#ffffff" />
    
    <!-- Camera Lens -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#2c3e50" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#2c3e50"/>
    
    <!-- Flash -->
    <rect x="-25" y="-15" width="8" height="6" rx="2" fill="#e74c3c"/>
    
    <!-- Viewfinder -->
    <rect x="10" y="-18" width="15" height="8" rx="2" fill="#34495e"/>
    
    <!-- Film Strip -->
    <g transform="translate(0, 35)">
      <rect x="-40" y="0" width="80" height="15" fill="url(#accentGradient)" rx="2"/>
      <rect x="-35" y="3" width="8" height="9" fill="#ffffff" rx="1"/>
      <rect x="-20" y="3" width="8" height="9" fill="#ffffff" rx="1"/>
      <rect x="-5" y="3" width="8" height="9" fill="#ffffff" rx="1"/>
      <rect x="10" y="3" width="8" height="9" fill="#ffffff" rx="1"/>
      <rect x="25" y="3" width="8" height="9" fill="#ffffff" rx="1"/>
    </g>
    
    <!-- Play Button (Media) -->
    <g transform="translate(0, -40)">
      <circle cx="0" cy="0" r="10" fill="#e74c3c"/>
      <polygon points="-3,-5 -3,5 5,0" fill="#ffffff"/>
    </g>
    
    <!-- Sparkles/Stars -->
    <g fill="#ffffff">
      <circle cx="-45" cy="-45" r="2"/>
      <circle cx="45" cy="-45" r="2"/>
      <circle cx="-45" cy="45" r="2"/>
      <circle cx="45" cy="45" r="2"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" text-anchor="middle" font-family="Playfair Display, serif" font-size="18" font-weight="700" fill="#2c3e50">MediaScope</text>
</svg>
